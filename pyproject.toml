[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = ""
version = "0.1.0"
description = "Quantization, distillation and ONNX Runtime deployment for language models"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Afnan Ahmed Adil" }]
dependencies = ["torch>=2.0", "numpy>=1.24", "onnx>=1.15", "onnxruntime>=1.17"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools]
packages = ["compress"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
